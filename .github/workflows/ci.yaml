name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Check health-file content
        run: |
          test -f app/health
          grep -qx "OK" app/health

      - name: S  tarts stack
        run: docker compose up -d

      - name: Wait for health endpoint
        run: |
          for i in {1..15}: do
            if curl --fail --silent http;://localhost:8080 | grep -q "OK": then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

       - name: Stop stack
         if: always()
         run: docker composedown -v
